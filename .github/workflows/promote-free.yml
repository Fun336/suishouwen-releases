name: Promote verified free Mac release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (vX.Y.Z)
        required: true
permissions:
  contents: read
concurrency:
  group: promote-release
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: prepare
        run: node scripts/promote-free.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          TARGET_ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.prepare.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: free-feed-${{ matrix.arch }}
          path: feeds/
          retention-days: 7
  promote:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: free-feed-*
          path: feeds
          merge-multiple: true
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const version = process.env.RELEASE_TAG.slice(1);
            const changes = [];
            const ref = await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            for (const arch of ['arm64','x64']) {
              const path = `mac-free/${arch}.xml`;
              let bytes; try { bytes = await fs.readFile('feeds/'+path); } catch(e) { if(e.code==='ENOENT')continue; throw e; }
              const statePath = `mac-free/${arch}.version.json`;
              let previous;
              try { const old=await github.rest.repos.getContent({...context.repo,path:statePath,ref:ref.data.object.sha}); previous=JSON.parse(Buffer.from(old.data.content,'base64').toString()); } catch(e) {if(e.status!==404)throw e;}
              const sha256 = require('node:crypto').createHash('sha256').update(bytes).digest('hex');
              if(previous) {
                const a=version.split('.').map(Number),b=previous.version.split('.').map(Number);
                let cmp=0; for(let i=0;i<3;i++){if(a[i]!==b[i]){cmp=a[i]-b[i];break;}}
                if(cmp<0)throw Error('Refusing downgrade');
                if(cmp===0) {if(previous.sha256!==sha256)throw Error('Refusing replacement of existing version');continue;}
              }
              const blob=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              changes.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
              changes.push({path:statePath,mode:'100644',type:'blob',content:JSON.stringify({version,sha256})+'\n'});
            }
            if(!changes.length){core.info('No free Mac feed to promote');return;}
            const commit=await github.rest.git.getCommit({...context.repo,commit_sha:ref.data.object.sha});
            const tree=await github.rest.git.createTree({...context.repo,base_tree:commit.data.tree.sha,tree:changes});
            const next=await github.rest.git.createCommit({...context.repo,message:`Publish verified free Mac update ${version}`,tree:tree.data.sha,parents:[ref.data.object.sha]});
            await github.rest.git.updateRef({...context.repo,ref:'heads/main',sha:next.data.sha,force:false});
