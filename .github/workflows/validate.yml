name: Validate release tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/verify-mac.mjs
      - run: node --test scripts/prepare.test.mjs
      - run: node --check scripts/promote-free.mjs
      - run: node --test scripts/free-feed.test.mjs
